<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="AM Prem — Alight Motion Premium gratis & instan." />
<title>AM Prem — Alight Motion Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="halftone"></div>
  <div class="burst"></div>

  <main class="card">
    <div class="avatar-wrap">
      <div class="avatar">💥</div>
      <div class="star s1">★</div>
      <div class="star s2">✦</div>
      <div class="star s3">★</div>
    </div>

    <h1 class="title">AM PREM</h1>
    <p class="tagline">Alight Motion Premium — Gratis &amp; Instan!</p>

    <div class="form-box">
      <label class="comic-label" for="email">📧 EMAIL TARGET</label>
      <input id="email" type="email" placeholder="kamu@email.com" class="comic-input" autocomplete="email" />

      <button id="btnSend" class="comic-btn btn-send" type="button">
        <span>KIRIM MAGIC LINK</span>
      </button>

      <div class="divider"><span>ATAU</span></div>

      <label class="comic-label" for="link">🔗 LINK VERIFIKASI</label>
      <input id="link" type="text" placeholder="Paste link dari email di sini..." class="comic-input" autocomplete="off" />

      <button id="btnVerify" class="comic-btn btn-verify" type="button">
        <span>VERIFIKASI SEKARANG</span>
      </button>
    </div>

    <div id="result" class="result hidden" role="status" aria-live="polite"></div>

    <footer class="footer">
      <p>© 2025 AM PREM · by <b>puttraa</b></p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
